project_id = "career-service-portal"

[auth]
# NOTE: this project's linked CLI version does not resolve env(...)
# interpolation on push — it was pushed to Supabase as the literal string
# "env(NEXT_PUBLIC_SITE_URL)", silently breaking the invite/reset redirect
# for weeks. Use the real hardcoded production URL here instead. Update this
# value (and re-run `supabase config push`, or PATCH the Management API
# directly if push proves unreliable again) if the production domain changes.
site_url = "https://careerportal-ten.vercel.app"
additional_redirect_urls = [
  "https://careerportal-ten.vercel.app/api/auth/callback",
  "http://localhost:3000/api/auth/callback",
]
jwt_expiry = 3600
enable_confirmations = true

[auth.email]
# NOTE: this "enabled" field does not map to the Email provider toggle in
# this Supabase CLI version — `config push` silently no-ops on it. The real
# toggle is the `external_email_enabled` field on the Management API
# (Dashboard: Authentication -> Providers -> Email), and must be set there
# or via `PATCH /v1/projects/{ref}/config/auth` directly.
enabled = true
enable_signup = false
double_confirm_changes = true
max_frequency = "1m0s"

# Custom email templates require SMTP to be configured — the hosted project's
# built-in email service rejects template pushes on the free tier (400).
# Re-enable once custom SMTP is set up (Dashboard → Auth → SMTP Settings),
# or apply supabase/templates/*.html manually via the Dashboard in the meantime.
# [auth.email.template.invite]
# subject = "You've been invited to the Career & Service Portal"
# content_path = "./supabase/templates/invite.html"

# [auth.email.template.recovery]
# subject = "Reset your Career & Service Portal password"
# content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
email_sent = 10
